<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen font-sans">
    <header class="bg-white shadow-md py-4 mb-8">
      <div class="container mx-auto px-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-orange-600 flex items-center gap-2">
          Recipe Finder
        </h1>
      </div>
    </header>

    <main class="container mx-auto px-4 pb-12">
      <div class="max-w-xl mx-auto text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">
          Delicious Recipes at Your Fingertips
        </h2>
        <div class="flex gap-2">
          <input
            type="text"
            id="searchInput"
            placeholder="Search for meals (e.g., chicken, pasta)..."
            class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 shadow-sm"
          />
          <button
            onclick="searchMeals()"
            class="bg-orange-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-orange-700 transition shadow-md"
          >
            Search
          </button>
        </div>
      </div>

      <div id="loading" class="hidden text-center py-10">
        <div
          class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-orange-600 border-t-transparent"
        ></div>
      </div>

      <div
        id="recipeGrid"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      ></div>

      <div
        id="errorMsg"
        class="hidden text-center text-red-500 font-semibold py-10"
      >
        No recipes found. Try searching something else!
      </div>
    </main>

    <div
      id="recipeModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50"
    >
      <div
        class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl"
      >
        <button
          onclick="closeModal()"
          class="absolute top-4 right-4 text-gray-500 hover:text-red-600 text-2xl font-bold"
        >
          &times;
        </button>
        <div id="modalContent"></div>
      </div>
    </div>

    <script src="recepie.js"></script>
  </body>
</html>
